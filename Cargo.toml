[package]
name = "skrinka"
version = "0.1.0"
edition = "2021"

[dependencies]
winit        = "0.30"
softbuffer   = "0.4"
global-hotkey = "0.8"
tray-icon    = "0.26"
arboard      = "3"
image        = { version = "0.25", default-features = false, features = ["png"] }
rfd          = "0.17"
toml         = "1"
serde        = { version = "1", features = ["derive"] }
chrono       = "0.4"
dirs         = "7"
fontdue      = "0.9"
log          = "0.4"
simplelog    = "0.12"
anyhow       = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
] }
winreg = "0.56"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
